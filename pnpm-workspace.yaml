packages:
  - apps/*
  - packages/*

# Single source of truth for versions shared across workspaces.
# Expo-owned versions (expo-*, react-native*, react*) are pinned per the SDK 57
# template and must only be changed via `npx expo install --check`.
catalog:
  # language + tooling
  typescript: ~6.0.3
  eslint: ^10.9.1
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.68.0
  prettier: ^3.6.2
  vitest: ^4.1.11
  tsx: ^4.23.12

  # shared runtime
  zod: ^4.4.3

  # api
  fastify: ^5.12.1
  '@fastify/cors': ^11.3.0
  '@fastify/helmet': ^13.1.1
  '@fastify/rate-limit': ^11.2.0
  fastify-type-provider-zod: ^7.0.0
  mongodb: ^7.6.0
  pino: ^10.3.1
  pino-pretty: ^13.1.2
  'mongodb-memory-server': ^11.2.0
  esbuild: ^0.28.2
  better-auth: ^1.7.1
  '@better-auth/expo': ^1.7.1
  resend: ^6.24.0

  # react / expo (SDK 57)
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.2
  react-native-web: ~0.21.0
  '@types/react': ~19.2.2

# esbuild needs its platform binary; mongodb-memory-server downloads a mongod.
onlyBuiltDependencies:
  - esbuild
  - mongodb-memory-server

# Keep the React Native toolchain on one minor. Expo SDK 57 targets RN 0.86.
overrides:
  '@react-native/metro-config': 0.86.2
