packages:
  - apps/*
  - packages/*

# Single source of truth for versions shared across workspaces — and only
# those. `eslint`, `@eslint/js`, `prettier` and `typescript-eslint` are declared
# in the root manifest and nowhere else, so a catalog entry for them shared
# nothing; it only added a second place to write the version down. It also
# broke them. Dependabot rewrites the *root* importer's `specifier: 'catalog:'`
# to a concrete version when it bumps a catalog entry, and `--frozen-lockfile`
# then rejects the pair — which is how #1189 and #1197 both died on
# `typescript-eslint`, before a single test ran. The same bump against
# `apps/*` passes, so it is the root importer specifically. Those four now
# carry literal versions in the root `package.json`; do not move them back.
#
# What is left here is genuinely shared: `typescript` by the root and all three
# workspaces, `@types/node` by the root and `apps/api`, `vitest` by the three
# workspaces. `tsx` has one consumer and stays anyway — it is not declared at
# the root, so it never hits the bug above.
#
# Expo-owned versions (expo-*, react-native*, react*) are pinned per the SDK 57
# template and must only be changed via `npx expo install --check`.
catalog:
  # language + tooling
  '@types/node': ^24.3.0
  typescript: ~6.0.3
  vitest: ^4.1.11
  tsx: ^4.23.12

  # shared runtime
  zod: ^4.5.4

  # api
  fastify: ^5.12.1
  '@fastify/cors': ^11.3.0
  '@fastify/helmet': ^13.1.1
  '@fastify/rate-limit': ^11.2.0
  fastify-type-provider-zod: ^7.0.0
  mongodb: ^7.6.0
  pino: ^10.3.1
  pino-pretty: ^13.1.2
  'mongodb-memory-server': ^11.2.0
  esbuild: ^0.28.2
  better-auth: ^1.7.1
  '@better-auth/expo': ^1.7.1
  resend: ^6.26.0
  jose: ^6.2.10
  '@aws-sdk/client-s3': ^3.1119.0
  '@aws-sdk/s3-request-presigner': ^3.1119.0
  'node-appwrite': ^28.0.0
  'socket.io': ^4.8.3
  'socket.io-client': ^4.8.3

  # mobile client
  '@tanstack/react-query': ^5.102.8

  # observability
  '@sentry/node': ^10.19.0

  # react / expo (SDK 57)
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.3
  react-native-web: ~0.21.0
  '@types/react': ~19.2.2

# esbuild needs its platform binary; mongodb-memory-server downloads a mongod.
onlyBuiltDependencies:
  - esbuild
  - mongodb-memory-server

# Keep the React Native toolchain on one minor. Expo SDK 57 targets RN 0.86.
#
# The override alone never bit. Nothing *depends* on `@react-native/metro-config`
# — react-native and react-native-worklets only declare it as a peer — and an
# override rewrites dependency specs, so there was no spec to rewrite and the
# peer resolved to whatever the registry offered, which was 0.87.1 from the next
# minor. It is listed as a devDependency of apps/mobile as well, which is what
# actually puts a 0.86 copy in the tree for the override to hold at.
#
# Dependabot pushes on this. It offered 0.87.1 — the same next-minor that
# leaked in before — inside the first grouped pull request (#1189, closed),
# where the version would have moved under a title naming thirteen other
# packages. `.github/dependabot.yml` now excludes `@react-native/*` from the
# group for that reason. The devDependency and this override have to move
# together, and only when Expo's SDK does.
overrides:
  '@react-native/metro-config': 0.86.3
