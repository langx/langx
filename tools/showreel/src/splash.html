<meta charset="utf-8" />
<title>LangX Launch</title>
<meta
  name="description"
  content="The app's launch animation: the Venus end card builds, and Venus drops in."
/>
<style>
  :root {
    color-scheme: dark;
    --ground: #ffc409;
    --hud-bg: #17191c;
    --hud-fg: #f2f3f5;
    --hud-muted: #9aa1a9;
    --hud-line: #2c3036;
    --hud-accent: #ffc409;
    --hud-focus: #7c9cf9;
  }
  html,
  body {
    height: 100%;
  }
  body {
    margin: 0;
    background: var(--ground);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    font-family:
      'Nunito',
      system-ui,
      -apple-system,
      'Segoe UI',
      sans-serif;
  }
  #viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--ground);
    touch-action: manipulation;
  }
  #stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    transform-origin: 0 0;
    overflow: hidden;
    contain: layout paint;
  }
  .scene {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  .scene * {
    box-sizing: border-box;
  }

  /* The player. Out of the way while the reel runs; back on a touch or a key. */
  .hud {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex;
    justify-content: center;
    pointer-events: none;
    transition:
      opacity 240ms ease,
      transform 240ms ease;
  }
  .hud[data-visible='false'] {
    opacity: 0;
    transform: translateY(8px);
  }
  .hud-bar {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 12px;
    width: min(760px, 100%);
    padding: 8px 12px;
    border-radius: 14px;
    background: var(--hud-bg);
    color: var(--hud-fg);
    box-shadow: 0 12px 32px -12px rgba(0, 0, 0, 0.5);
  }
  .hud-btn {
    flex: none;
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    padding: 0;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: inherit;
    cursor: pointer;
  }
  .hud-format {
    width: auto;
    padding: 0 8px;
    font:
      700 13px/1 ui-monospace,
      'SF Mono',
      Menlo,
      Consolas,
      monospace;
    letter-spacing: 0.02em;
  }
  .hud-btn svg {
    width: 22px;
    height: 22px;
  }
  .hud-btn:hover {
    background: var(--hud-line);
  }
  .hud-btn:focus-visible,
  .hud-track:focus-visible,
  .sound-hint:focus-visible {
    outline: 2px solid var(--hud-focus);
    outline-offset: 2px;
  }
  .hud-time {
    flex: none;
    font:
      600 13px/1 ui-monospace,
      'SF Mono',
      Menlo,
      Consolas,
      monospace;
    font-variant-numeric: tabular-nums;
    color: var(--hud-muted);
    letter-spacing: 0.02em;
  }
  .hud-track {
    position: relative;
    flex: 1;
    min-width: 0;
    height: 28px;
    cursor: pointer;
    touch-action: none;
  }
  .hud-track::before,
  .hud-fill {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: 12px;
    height: 4px;
    border-radius: 2px;
  }
  .hud-track::before {
    background: var(--hud-line);
  }
  .hud-fill {
    background: var(--hud-accent);
    transform-origin: 0 50%;
    transform: scaleX(0);
  }
  .hud-chapters {
    position: absolute;
    inset: 0;
  }
  .hud-chapter {
    position: absolute;
    top: 10px;
    height: 8px;
    border-left: 2px solid var(--hud-bg);
  }
  .sound-hint {
    position: absolute;
    top: calc(16px + env(safe-area-inset-top, 0px));
    right: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px 8px 10px;
    border: 0;
    border-radius: 14px;
    background: var(--hud-bg);
    color: var(--hud-fg);
    font:
      700 14px/1 'Nunito',
      system-ui,
      sans-serif;
    cursor: pointer;
  }
  .sound-hint svg {
    width: 20px;
    height: 20px;
  }
  .tc {
    position: absolute;
    left: 8px;
    top: 8px;
    padding: 4px 8px;
    border-radius: 6px;
    background: rgba(0, 0, 0, 0.72);
    color: #fff;
    font:
      600 12px/1.2 ui-monospace,
      Menlo,
      monospace;
    z-index: 60;
  }
  @media (max-width: 480px) {
    .hud-time {
      display: none;
    }
  }
</style>

<div id="viewport" role="region" aria-label="LangX launch animation">
  <div id="stage"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/CustomEase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/SplitText.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/MorphSVGPlugin.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/DrawSVGPlugin.min.js"></script>
<!--
  One scene, no score: the app's launch animation, rendered to
  apps/mobile/assets/splash/intro.mp4. The plan is set before core.js loads,
  which is the runtime's documented way in for a cut other than the reel's.
  Its length is in beats at 120 BPM, so 4.8 is 2.4 s. It sets no text, so it
  loads no fonts: the wordmark is outlines.
-->
<script>
  // `?theme=dark` is the night cut: the app's dark ground instead of the yellow.
  window.REEL_PLAN = [
    {
      id: 'splash',
      title: 'Launch',
      start: 0,
      dur: 4.8,
      ground: new URLSearchParams(location.search).get('theme') === 'dark' ? '#1c1f24' : '#ffc409',
    },
  ]
</script>
<script src="core.js"></script>
<script src="splash/venus-rig.js"></script>
<script src="splash/splash.js"></script>
<script>
  window.REEL.boot()
</script>
