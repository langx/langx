# The voice service on Fly.io — see server.py for what it is.
#
# Secrets are NOT here — this file is committed and the repo is public. Set
# TTS_SECRET with `fly secrets set -a langx-tts`; the API is given the same
# value. Deploy with `flyctl deploy apps/tts` from the repository root, which
# deploy-tts.yml does on every merge that touches apps/tts.

app = 'langx-tts'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

# No `[deploy] strategy`: one machine, and a request during the swap simply
# waits for the new one to boot. Blue-green would double a 2 GB machine for
# a service that answers a few times an hour.

# Private, and asleep between requests. The app has no public IP — only a
# Flycast address (`fly ips allocate-v6 --private`), so `langx-tts.flycast`
# resolves from the API's machines and from nowhere else. Fly's proxy still
# fronts Flycast traffic, which is what makes autostart work on a private app:
# the first request of the hour wakes the machine, the reading is made, and
# after a few idle minutes the proxy puts it back to sleep.
# `min_machines_running = 0` is the whole cost story — a sleeping machine is
# billed for its storage and nothing else, and that is true of both ways of
# sleeping.
#
# Which is why it sleeps by `suspend` rather than by `stop`: the two cost the
# same and only one of them is a wait anybody would sit through. A stopped
# machine is booted from nothing — measured on 20 September 2026, a second of
# Firecracker and then twenty-three more of Python imports and Kokoro's 330 MB
# through ONNX Runtime before the socket opens, and four seconds for the first
# reading after that while espeak and the session warm up. Half a minute of
# spinner for one sentence. A suspended machine is its memory written to disk
# and read back: it resumed in about two seconds and answered that first
# request in 1.5, the warm figure, because the model never left RAM.
#
# Two things suspension is not. It is not durable — Fly may drop a snapshot,
# and a deploy replaces the machine outright — so a cold boot stays a normal
# event rather than a fault, and the sixty seconds `HttpTtsProvider` allows
# itself are still sized for one. And it is capped at 4 GB of memory, which
# the 2 GB below is under, with about 800 MB of that in use once the model is
# loaded.
[http_service]
  internal_port = 8080
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # One reading at a time — server.py holds a lock around the model — and one
  # more waiting. Past that the proxy answers 503 rather than queueing a
  # minute of requests behind a cold start; the API's timeout is sixty seconds
  # and the app's button shows a spinner, so a refusal is a retry, not a hang.
  [http_service.concurrency]
    type = 'requests'
    soft_limit = 1
    hard_limit = 2

# /health answers only once the model is loaded, so the grace period is the
# load: a few seconds for the fp32 model from a warm disk, longer on a cold
# machine. Sixty is generous on purpose — a check that fails during the load
# restarts a machine that was about to be ready.
[[http_service.checks]]
  interval = '15s'
  timeout = '5s'
  grace_period = '60s'
  method = 'GET'
  path = '/health'

# 2 GB for a 300 MB model: ONNX Runtime's session and the phonemiser's tables
# take several times the file, and a machine that swaps mid-read is slower
# than one that costs a cent more while awake. Two shared vCPUs halve the
# read time over one, and it is asleep most of the day either way.
[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
