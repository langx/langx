# The voice service on Fly.io — see server.py for what it is.
#
# Secrets are NOT here — this file is committed and the repo is public. Set
# TTS_SECRET with `fly secrets set -a langx-tts`; the API is given the same
# value. Deploy with `flyctl deploy apps/tts` from the repository root, which
# deploy-tts.yml does on every merge that touches apps/tts.

app = 'langx-tts'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

# No `[deploy] strategy`: one machine, and a request during the swap simply
# waits for the new one to boot. Blue-green would double a 3 GB machine for
# a service that answers a few times an hour.

# Private, and asleep between requests. The app has no public IP — only a
# Flycast address (`fly ips allocate-v6 --private`), so `langx-tts.flycast`
# resolves from the API's machines and from nowhere else. Fly's proxy still
# fronts Flycast traffic, which is what makes autostart work on a private app:
# the first request of the hour wakes the machine, the reading is made, and
# after a few idle minutes the proxy puts it back to sleep.
# `min_machines_running = 0` is the whole cost story — a sleeping machine is
# billed for its storage and nothing else, and that is true of both ways of
# sleeping.
#
# Which is why it sleeps by `suspend` rather than by `stop`: the two cost the
# same and only one of them is a wait anybody would sit through. A stopped
# machine is booted from nothing — measured on 20 September 2026, a second of
# Firecracker and then twenty-three more of Python imports and Kokoro's 330 MB
# through ONNX Runtime before the socket opens, and four seconds for the first
# reading after that while espeak and the session warm up. Half a minute of
# spinner for one sentence. A suspended machine is its memory written to disk
# and read back: it resumed in about two seconds and answered that first
# request in 1.5, the warm figure, because the model never left RAM.
#
# Two things suspension is not. It is not durable — Fly may drop a snapshot,
# and a deploy replaces the machine outright — so a cold boot stays a normal
# event rather than a fault, and the sixty seconds `HttpTtsProvider` allows
# itself are still sized for one. And it is not free of size: Fly recommends it
# for machines of 2 GB or less and discourages larger ones, because a bigger
# snapshot takes longer to write and read back. The machine below is 3 GB for
# Whisper's sake; see `[[vm]]` for why that is the smaller of two bad trades.
[http_service]
  internal_port = 8080
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # One reading and one transcription at a time — server.py holds a lock
  # around each model, separately so that neither waits on the other — and
  # one more of each waiting. Past that the proxy answers 503 rather than
  # queueing a minute of requests behind a cold start or a two-minute note;
  # the app shows a spinner either way, so a refusal is a retry, not a hang.
  # The proxy counts requests, not routes, so four is the sum rather than a
  # promise about the mix.
  [http_service.concurrency]
    type = 'requests'
    soft_limit = 2
    hard_limit = 4

# /health answers only once the model is loaded, so the grace period is the
# load: a few seconds for the fp32 model from a warm disk, longer on a cold
# machine. Sixty is generous on purpose — a check that fails during the load
# restarts a machine that was about to be ready. Kokoro's load only: Whisper
# is loaded by the first transcription, not at boot (see `whisper` in
# server.py), so it adds nothing here.
[[http_service.checks]]
  interval = '15s'
  timeout = '5s'
  grace_period = '60s'
  method = 'GET'
  path = '/health'

# 3 GB, from a measurement rather than the file sizes. One process with
# everything this service can hold, measured on 28 September 2026: Kokoro
# loaded and one reading made, 610 MB resident; three Piper voices in the
# cache, 900 MB; Whisper `small` loaded in int8, 1.57 GB; and while it reads a
# one- or two-minute note, peaks of 2.0 to 2.3 GB. A 2 GB machine would be
# killed for memory by the longest notes once the Piper cache is full, and
# the kernel takes its share first.
#
# Which leaves two trades, and this is the smaller. More memory than Fly
# recommends for suspending (see `[http_service]`) makes the snapshot slower
# to write and resume; less makes the service crash under a long note. 3 GB
# is the measured peak with room for the kernel and the allocator's slack; 4
# would be further still from Fly's recommendation for a margin nothing
# measured asks for.
#
# Four shared vCPUs rather than two, because transcription is the slow one: a
# two-minute note is tens of seconds of CPU and the threads divide it, and a
# reading made alongside it still has cores to run on. Billed per second
# while awake only — about 2.5 cents an hour at Fly's list price against 1.6
# for the 2x/2 GB it replaced — and asleep most of the day either way.
[[vm]]
  size = 'shared-cpu-4x'
  memory = '3gb'
