/*
 * The phone's half of a call that rings while the app is closed: the call
 * notification, the foreground service that holds it, and the two buttons
 * that work with no JavaScript running. `car-messaging` routes the ring's
 * data push here; see `CallPush`.
 */
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.calls'
version = '1.0.0'

android {
  namespace 'expo.modules.calls'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
}
