# An internal-distribution build, started by hand only.
#
# Deliberately not on push: a cloud build is the expensive thing on the plan,
# and a code change that only touches JS reaches an install over the air
# instead — automatically, through production-update.yml. The profile is
# still called `preview` (an APK, internal distribution) but it publishes and
# reads on the `production` channel like everything else.
name: Preview build
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: Which platform to build
        default: android
        options: [android, ios]

jobs:
  build_preview:
    type: build
    params:
      platform: ${{ inputs.platform }}
      profile: preview
