/*
 * The Wear OS app.
 *
 * A module of the phone app's own Gradle build rather than a project of its
 * own, because the Data Layer only connects a watch app to a phone app with
 * the **same application id and the same signing key**. Building it here is
 * what makes that true without a second signing story.
 *
 * `apps/mobile/wear/` is the source of record; `expo prebuild` regenerates
 * `android/` and would delete anything written straight into it, which is the
 * same reason the Apple targets live in `apps/mobile/targets/`. The config
 * plugin `plugins/withWearApp.js` copies this in and adds `include ':wear'`.
 */
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

/*
 * Resolved once, above `android { }`, and not inline in `defaultConfig`.
 *
 * `versionCode (expr) as Integer` reads like a cast and is not one: Groovy
 * binds it as `versionCode(expr) as Integer`, so the coercion lands on the
 * method's return value and the *argument* stays a String. With no `-P` the
 * argument is the literal 1 and everything looks fine; pass
 * `-PwearVersionCode=1000` and AGP fails with "Value is null", pointing at a
 * line whose text says Integer. Naming the value first removes the trap.
 */
def wearVersionCode = (project.findProperty('wearVersionCode') ?: 1) as Integer
def wearVersionName = (project.findProperty('wearVersionName') ?: '1.0') as String

android {
  namespace 'tech.newchapter.languageXchange.wear'
  compileSdk rootProject.ext.compileSdkVersion

  defaultConfig {
    /*
     * The phone app's id, not a `.wear` suffix of it. The Data Layer pairs a
     * watch app to a phone app by application id and signature; a suffixed id
     * installs and runs and then never hears from the phone, which is the
     * failure that looks like a bug in the code rather than in the manifest.
     */
    applicationId 'tech.newchapter.languageXchange'
    /*
     * 30, not the phone's 24. Wear OS 3 is the floor that has Compose for Wear
     * and the modern Data Layer; a watch older than that is not a device this
     * app is going to reach. The phone's own floor is untouched — a watch is
     * an accessory to it, not a gate on it.
     */
    minSdk 30
    targetSdk rootProject.ext.targetSdkVersion
    /*
     * Passed in for a release, and the release build refuses to run without it
     * — see `buildTypes.release` below.
     *
     * The watch APK goes to Play under the phone app's own application id, so
     * Play sees two artefacts for one package and requires their version codes
     * to differ. A number committed here would be one more place to remember
     * on every release, and the one that was committed (1) would have been
     * rejected on sight.
     *
     * The fallback is 1 rather than 0 because AGP rejects a non-positive
     * version code while *configuring* the project, which happens before any
     * check of ours can run and would take `assembleDebug` down with it. So
     * the placeholder has to be valid, and the release gate below is what
     * makes sure it is never the thing that ships.
     */
    versionCode wearVersionCode
    versionName wearVersionName
  }

  buildFeatures { compose true }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions { jvmTarget = '17' }

  /*
   * The app module's keystore, named explicitly rather than left to this
   * module's own `signingConfigs.debug`.
   *
   * The Data Layer pairs a watch app to a phone app by application id **and
   * signing certificate**. A module that falls back to `~/.android/debug.keystore`
   * while the app uses the generated `app/debug.keystore` produces two APKs
   * that install, run, and never hear each other — no error anywhere, the
   * watch simply shows its "open the app on your phone" state forever. That is
   * exactly what happened, and it cost a long detour.
   */
  signingConfigs {
    shared {
      storeFile file('../app/debug.keystore')
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
    /*
     * The **phone app's** upload key, not a key of the watch's own. Play App
     * Signing re-signs what we upload with the app signing key, so in
     * production both artefacts end up carrying the same certificate and the
     * Data Layer pairs — but only if the upload itself is signed with the one
     * upload key Play holds for this package. A second key would be rejected
     * at upload, and a debug key would be rejected before that.
     *
     * Read from the environment because this repo is public and the keystore
     * is not in it.
     */
    upload {
      def store = System.getenv('LANGX_UPLOAD_KEYSTORE')
      if (store) {
        storeFile file(store)
        storePassword System.getenv('LANGX_UPLOAD_KEYSTORE_PASSWORD')
        keyAlias System.getenv('LANGX_UPLOAD_KEY_ALIAS')
        keyPassword System.getenv('LANGX_UPLOAD_KEY_PASSWORD')
      }
    }
  }

  buildTypes {
    debug { signingConfig signingConfigs.shared }
    release {
      minifyEnabled false
      /*
       * Signed with the upload key and refusing to build without it.
       *
       * This used to sign `release` with the debug keystore above. That was
       * right for the only thing the release build had ever been asked to do —
       * run on a paired emulator, where the watch and the phone had to carry
       * the same key — and wrong for the only thing it is asked to do now.
       * Play rejects a debug-signed upload, and it rejects it after the
       * build, so the failure would arrive at the end of the slow part.
       *
       * Failing here instead, by name, is the whole point: the message says
       * which variable is missing rather than leaving an unuploadable APK on
       * disk that looks exactly like a good one.
       */
      signingConfig signingConfigs.upload
    }
  }

  /*
   * `assembleRelease` is the only task that needs the four variables and the
   * version code, so the check is scoped to it: `assembleDebug` on an emulator
   * keeps working with nothing exported, which is how the watch app is
   * developed.
   */
  gradle.taskGraph.whenReady { graph ->
    if (!graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }) return
    def missing = [
      'LANGX_UPLOAD_KEYSTORE',
      'LANGX_UPLOAD_KEYSTORE_PASSWORD',
      'LANGX_UPLOAD_KEY_ALIAS',
      'LANGX_UPLOAD_KEY_PASSWORD',
    ].findAll { !System.getenv(it) }
    if (!project.hasProperty('wearVersionCode')) missing << '-PwearVersionCode=<n>'
    if (missing) {
      throw new GradleException(
        "The Wear release build needs ${missing.join(', ')}. " +
        'It signs with the phone app\'s upload key — the same key Play holds for ' +
        'tech.newchapter.languageXchange — and takes a version code that differs ' +
        'from the phone\'s. See docs/plans/phase-2-watch.md.')
    }
  }
}

dependencies {
  implementation platform('androidx.compose:compose-bom:2025.04.00')
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.ui:ui-tooling-preview'
  implementation 'androidx.wear.compose:compose-material:1.4.1'
  implementation 'androidx.wear.compose:compose-foundation:1.4.1'
  implementation 'androidx.wear.compose:compose-navigation:1.4.1'
  implementation 'androidx.activity:activity-compose:1.9.3'
  /*
   * Named explicitly because `registerForActivityResult` refuses to run on
   * Fragment older than 1.3.0, and lint fails the release build over it: the
   * versions the Wear Compose artifacts drag in resolve lower than that.
   */
  implementation 'androidx.fragment:fragment:1.8.5'
  implementation 'androidx.core:core-ktx:1.15.0'
  // `RemoteInputIntentHelper` — Wear's own text entry screen, which offers
  // dictation, the keyboard and handwriting and lets the wearer choose.
  implementation 'androidx.wear:wear-input:1.1.0'
  // The Data Layer — the Android half of what `WCSession` does on Apple.
  implementation 'com.google.android.gms:play-services-wearable:19.0.0'
}
