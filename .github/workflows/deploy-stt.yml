# The transcript service's sibling of deploy-tts.yml: a merge that touches
# apps/stt becomes the running `langx-stt` on Fly. Its own token, scoped to
# that app alone, for the reason the voice service has its own: a token that
# can deploy two apps is a wider blast radius than either deploy needs.
#
# The image is built here on the runner, model included — a 460 MB download
# that is the reason this runs rarely and is not folded into deploy-api.yml.
name: Deploy STT

on:
  push:
    branches: [main]
    paths:
      - apps/stt/**
      - .github/workflows/deploy-stt.yml
      - '!**/*.md'
  workflow_dispatch:

concurrency:
  group: deploy-stt
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same pinned install as deploy-api.yml, for the same reason.
      - name: Install flyctl
        run: |
          curl -fsSL https://fly.io/install.sh | sh -s -- 0.4.102
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_STT_API_TOKEN }}
        # The directory, not `-c apps/stt/fly.toml`: the config is found in it,
        # and it is also the build context the Dockerfile's COPY lines expect.
        run: flyctl deploy apps/stt
