# A pushed version tag becomes a GitHub Release, with the notes written by
# `scripts/release-notes.mjs`: the store's own "What's new" for that version on
# top, then the pull requests merged since the previous tag, grouped by what
# they touched. GitHub's `--generate-notes` wrote one flat list instead, which
# at v2.6 was forty-six sentences about pull requests and none about the
# release.
#
# The tag is the trigger and `pnpm release` is what makes one: it bumps the
# version, commits and tags, and the person pushes. It builds nothing —
# `deploy-web.yml` ships the web on merge, store builds and OTA updates live
# on expo.dev (`apps/mobile/.eas/workflows/`), and a store build is still a
# decision someone makes there.
#
# The guard is the tag having to match the version in package.json. A tag
# typed by hand, or pushed from a commit that is not the release commit,
# fails here instead of becoming a Release that names a version nothing
# ships as.
name: GitHub Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The notes are written from the commits and tags between this release
      # and the one before it, so a shallow clone has nothing to read.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: The tag must be the version in package.json
        run: |
          version="$(node scripts/release.mjs --print)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/notes.md"
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/notes.md"
