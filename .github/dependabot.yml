version: 2
updates:
  # Dependabot's "npm" ecosystem also understands pnpm-lock.yaml (this is a
  # single pnpm workspace, one lockfile at the repo root) — without this file
  # at all, GitHub's automatic security-update system still tries to patch
  # vulnerable transitive deps, but without pnpm-workspace awareness, which is
  # what produced the failing "npm_and_yarn ... uuid" PR.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
